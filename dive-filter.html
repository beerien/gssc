<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dive Events — Gregory Seahurst Swim Club</title>
  <!--
    GSSC DIVE EVENTS PAGE
    Fetches the live SwimTopia iCal feed, filters for events whose
    SUMMARY starts with "dive" (case-insensitive), and renders them
    in a clean list matching GSSC's blue color scheme.

    Data source: https://gregory.swimtopia.com/calendar_events.ics
    Hosted on:   https://beerien.github.io/gssc/dive-filter.html

    Companion page: https://beerien.github.io/gssc/swim-filter.html

    Author:       ACS
    Last Updated: 2026-05-13

    "It's not a moon. It's a dive meet." - Obi-Wan, probably
    "Course I know what a dive meet is." - Forrest Gump, probably not
  -->
  <style>
    /* -----------------------------------------------------------------------
       BASE STYLES
       Simple, clean, mobile-friendly. Blue palette to match GSSC branding.
    ----------------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #333;
      padding: 20px;
    }

    /* Page header */
    .page-header {
      background: #1a5276;
      color: white;
      padding: 16px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-size: 1.4em;
      font-weight: bold;
    }

    .page-header p {
      font-size: 0.85em;
      margin-top: 4px;
      opacity: 0.85;
    }

    /* Loading and error states */
    .status-message {
      text-align: center;
      padding: 30px;
      color: #666;
      font-style: italic;
    }

    .error-message {
      background: #fdecea;
      border: 1px solid #e74c3c;
      border-radius: 6px;
      padding: 16px;
      color: #c0392b;
      font-size: 0.9em;
    }

    /* No events found state */
    .no-events {
      text-align: center;
      padding: 30px;
      color: #888;
    }

    /* Event list */
    .event-list {
      list-style: none;
    }

    /* Individual event card */
    .event-card {
      background: white;
      border-radius: 6px;
      border-left: 5px solid #1a5276;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* Date badge — blue box above the title */
    .event-date {
      display: inline-block;
      background: #2980b9;
      color: white;
      font-size: 0.75em;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 3px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Event title */
    .event-title {
      font-size: 1em;
      font-weight: bold;
      color: #1a5276;
      margin-bottom: 4px;
    }

    /* Location line */
    .event-location {
      font-size: 0.85em;
      color: #666;
      margin-bottom: 4px;
    }

    .event-location::before {
      content: "📍 ";
    }

    /* Time line */
    .event-time {
      font-size: 0.85em;
      color: #555;
      margin-bottom: 4px;
    }

    .event-time::before {
      content: "🕐 ";
    }

    /* Description */
    .event-description {
      font-size: 0.82em;
      color: #555;
      margin-top: 8px;
      line-height: 1.5;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }

    /* Cross-link to swim page — mirrors swim-filter.html companion-link style */
    .companion-link {
      text-align: center;
      margin-bottom: 16px;
      font-size: 0.82em;
    }

    .companion-link a {
      color: #1f618d;
      text-decoration: none;
      background: #dbeafe;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #aed6f1;
    }

    .companion-link a:hover {
      background: #aed6f1;
    }

    /* -----------------------------------------------------------------------
       FILTER CONTROLS
       Mirrors swim-filter.html. Both checkboxes default to checked (visible)
       since the total dive event count is small.
    ----------------------------------------------------------------------- */
    .filter-bar {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filter-label {
      display: flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1px solid #aed6f1;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85em;
      font-weight: bold;
      color: #1a5276;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .filter-label:hover {
      background: #dbeafe;
    }

    /* Visually dim the pill when its checkbox is unchecked */
    .filter-label.unchecked {
      background: #f0f4f8;
      color: #999;
      border-color: #ccc;
    }

    .filter-label input[type="checkbox"] {
      accent-color: #1a5276;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Meet cards — dark blue left border (same as base) */
    .event-card.cat-meet {
      border-left-color: #1a5276;
    }

    /* Other dive event cards — teal left border to distinguish */
    .event-card.cat-other {
      border-left-color: #148f77;
    }

    /* SwimTopia link at bottom */
    .swimtopia-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8em;
      color: #888;
    }

    .swimtopia-link a {
      color: #2980b9;
      text-decoration: none;
    }

    .swimtopia-link a:hover {
      text-decoration: underline;
    }

    /* Responsive — tighten up on small screens */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      .page-header h1 {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <h1>💦 Dive Events</h1>
    <p>Gregory Seahurst Swim Club — current season schedule</p>
  </div>

  <!-- Cross-link to companion swim page -->
  <div class="companion-link">
    <a href="https://beerien.github.io/gssc/swim-filter.html">
      🏊‍♂️ View Swim Events →
    </a>
  </div>

  <!-- Category filter checkboxes — both checked by default (small event set) -->
  <div class="filter-bar">
    <label class="filter-label" id="label-meets">
      <input type="checkbox" id="chk-meets" checked>
      🏆 Dive Meets
    </label>
    <label class="filter-label" id="label-other">
      <input type="checkbox" id="chk-other" checked>
      🎉 Other Dive Events
    </label>
  </div>

  <!-- Content area — populated by JavaScript below -->
  <div id="content">
    <p class="status-message">Loading dive events...</p>
  </div>

  <div class="swimtopia-link">
    <a href="https://gregory.swimtopia.com/swim_meets" target="_blank">
      View full schedule on SwimTopia →
    </a>
  </div>

  <script>
    // -------------------------------------------------------------------------
    // CONFIGURATION
    // Author:       ACS
    // Last Updated: 2026-05-13
    // "I am putting myself to the fullest possible use." - HAL 9000
    // -------------------------------------------------------------------------

    // SwimTopia public iCal feed URL
    var ICAL_URL = 'https://gregory.swimtopia.com/calendar_events.ics';

    // DIVE PREFIX — events starting with this belong on this page.
    // Case-insensitive prefix match on summary.
    var DIVE_PREFIX = 'dive';

    // PANCAKE KEYWORD — explicit include rule for the shared club event
    // "📷Pancake Breakfast and Pictures" which doesn't start with "dive"
    // but is relevant to the dive schedule.
    var PANCAKE_KEYWORD = 'pancake';

    // MEET DETECTION — dive events containing '@' are competition meets.
    // All four 2026 dual meets use the "DIVE - X @ Y" or "Dive - X @ Y" format.
    var MEET_KEYWORD = '@';

    // CORS proxy — required because browsers block direct cross-origin
    // fetches of .ics files. corsproxy.io returns plain text response.
    var PROXY_URL = 'https://corsproxy.io/?' + encodeURIComponent(ICAL_URL);

    // Module-level event store — populated after fetch, used by applyFilter()
    var allDiveEvents = [];

    // -------------------------------------------------------------------------
    // WIRE CHECKBOX HANDLERS
    // Done unconditionally at script load so checkboxes are always interactive
    // regardless of fetch success or failure.
    // "Mr. Data, make it so." - Picard
    // -------------------------------------------------------------------------
    document.getElementById('chk-meets').addEventListener('change', applyFilter);
    document.getElementById('chk-other').addEventListener('change', applyFilter);

    // -------------------------------------------------------------------------
    // FETCH AND RENDER
    // "These aren't the meets you're looking for." - Obi-Wan
    // -------------------------------------------------------------------------
    fetch(PROXY_URL)
      .then(function(response) {
        if (!response.ok) {
          throw new Error('Network response was not ok: ' + response.status);
        }
        return response.text();
      })
      .then(function(icalText) {
        if (!icalText) {
          throw new Error('Empty response from proxy.');
        }

        var events     = parseIcal(icalText);
        var diveEvents = filterDiveEvents(events);

        // Categorize and store
        allDiveEvents = categorizeEvents(diveEvents);

        // Render with both checkboxes checked (default)
        applyFilter();
      })
      .catch(function(err) {
        document.getElementById('content').innerHTML =
          '<div class="error-message">' +
          '<strong>Could not load dive events.</strong><br>' +
          'Error: ' + err.message + '<br><br>' +
          'Try refreshing, or visit the ' +
          '<a href="https://gregory.swimtopia.com/swim_meets">full schedule</a> ' +
          'on SwimTopia directly.' +
          '</div>';
        console.error('Dive filter fetch error:', err);
      });

    // -------------------------------------------------------------------------
    // APPLY FILTER
    // Reads checkbox states and re-renders the visible event subset.
    // Updates pill label styles to reflect checked/unchecked state.
    // Called on initial load and on every checkbox change event.
    // -------------------------------------------------------------------------
    function applyFilter() {
      var showMeets = document.getElementById('chk-meets').checked;
      var showOther = document.getElementById('chk-other').checked;

      // Update pill appearance to reflect state
      document.getElementById('label-meets').className =
        'filter-label' + (showMeets ? '' : ' unchecked');
      document.getElementById('label-other').className =
        'filter-label' + (showOther ? '' : ' unchecked');

      // Build visible subset based on checkbox state
      var visible = allDiveEvents.filter(function(event) {
        if (event.category === 'meet')  return showMeets;
        if (event.category === 'other') return showOther;
        return false;
      });

      renderEvents(visible);
    }

    // -------------------------------------------------------------------------
    // PARSE iCAL
    // Extracts VEVENT blocks from raw iCal text.
    // Returns an array of plain objects: summary, dtstart, dtend,
    // location, description.
    // -------------------------------------------------------------------------
    function parseIcal(text) {
      var events = [];

      // Normalize all line endings to \n regardless of source format
      text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      // Unfold continuation lines (iCal lines wrapped with leading space/tab)
      text = text.replace(/\n[ \t]/g, '');

      // Split into individual VEVENT blocks; first element is header — skip it
      var eventBlocks = text.split('BEGIN:VEVENT');

      for (var i = 1; i < eventBlocks.length; i++) {
        var block = eventBlocks[i];
        var event = {};

        event.summary     = extractField(block, 'SUMMARY');
        event.location    = extractField(block, 'LOCATION');
        event.description = extractField(block, 'DESCRIPTION');
        event.dtstart     = extractField(block, 'DTSTART');
        event.dtend       = extractField(block, 'DTEND');

        // Only include events with at minimum a summary and a start date
        if (event.summary && event.dtstart) {
          events.push(event);
        }
      }

      return events;
    }

    // -------------------------------------------------------------------------
    // EXTRACT FIELD
    // Pulls the value of a named iCal property from a VEVENT block.
    // Handles properties with parameters e.g. DTSTART;TZID=...:value
    // -------------------------------------------------------------------------
    function extractField(block, fieldName) {
      var regex = new RegExp(fieldName + '(?:;[^:]*)?:([^\\r\\n]*)', 'i');
      var match = block.match(regex);
      if (!match) return '';

      // Unescape iCal escape sequences
      return match[1]
        .replace(/\\,/g, ',')
        .replace(/\\n/g, ' ')
        .replace(/\\;/g, ';')
        .replace(/&nbsp\\;/g, ' ')
        .trim();
    }

    // -------------------------------------------------------------------------
    // FILTER DIVE EVENTS
    // Includes events that start with DIVE_PREFIX (case-insensitive) OR
    // contain PANCAKE_KEYWORD. Everything else is excluded.
    //
    // "Wubba lubba dub dub! That's a lotta pancakes!" - Rick Sanchez
    // -------------------------------------------------------------------------
    function filterDiveEvents(events) {
      return events.filter(function(event) {
        var s = event.summary.trim().toLowerCase();
        return s.indexOf(DIVE_PREFIX) === 0 ||
               s.indexOf(PANCAKE_KEYWORD) !== -1;
      });
    }

    // -------------------------------------------------------------------------
    // CATEGORIZE EVENTS
    // Assigns each dive event a category: 'meet' or 'other'.
    //
    // Rules (evaluated in order):
    //   1. Starts with DIVE_PREFIX AND contains MEET_KEYWORD ('@') → 'meet'
    //   2. Everything else (End of Year Party, Pancake Breakfast)  → 'other'
    //
    // "It's a trap! (categorization trap)" - Admiral Ackbar
    // -------------------------------------------------------------------------
    function categorizeEvents(events) {
      return events.map(function(event) {
        var s = event.summary.trim().toLowerCase();

        // Meet: must be a dive-prefixed event AND contain the @ opponent marker
        var isDivePrefixed = s.indexOf(DIVE_PREFIX) === 0;
        var hasMeetKeyword = event.summary.indexOf(MEET_KEYWORD) !== -1;

        event.category = (isDivePrefixed && hasMeetKeyword) ? 'meet' : 'other';
        return event;
      });
    }

    // -------------------------------------------------------------------------
    // FORMAT DATE
    // Converts iCal DTSTART value to a human-readable string.
    // Handles date-only (20260701) and datetime (20260701T163000) formats.
    // -------------------------------------------------------------------------
    function formatDate(dtValue) {
      if (!dtValue) return '';

      // Date-only format: YYYYMMDD
      if (dtValue.length === 8) {
        var year  = dtValue.substring(0, 4);
        var month = parseInt(dtValue.substring(4, 6), 10) - 1;
        var day   = parseInt(dtValue.substring(6, 8), 10);
        var d     = new Date(year, month, day);
        return d.toLocaleDateString('en-US', {
          weekday: 'short',
          month:   'long',
          day:     'numeric',
          year:    'numeric'
        });
      }

      // DateTime format: YYYYMMDDTHHmmss
      if (dtValue.length >= 15) {
        var year  = dtValue.substring(0, 4);
        var month = parseInt(dtValue.substring(4, 6), 10) - 1;
        var day   = parseInt(dtValue.substring(6, 8), 10);
        var hour  = parseInt(dtValue.substring(9, 11), 10);
        var min   = parseInt(dtValue.substring(11, 13), 10);
        var d     = new Date(year, month, day, hour, min);
        return d.toLocaleDateString('en-US', {
          weekday: 'short',
          month:   'long',
          day:     'numeric',
          year:    'numeric'
        });
      }

      return dtValue;
    }

    // -------------------------------------------------------------------------
    // FORMAT TIME
    // Extracts and formats the time portion of a DTSTART value.
    // Returns empty string for date-only (all-day) events.
    // -------------------------------------------------------------------------
    function formatTime(dtValue) {
      if (!dtValue || dtValue.length < 15) return '';

      var hour = parseInt(dtValue.substring(9, 11), 10);
      var min  = dtValue.substring(11, 13);
      var ampm = hour >= 12 ? 'PM' : 'AM';
      var h12  = hour % 12 || 12;

      return h12 + ':' + min + ' ' + ampm;
    }

    // -------------------------------------------------------------------------
    // SORT EVENTS
    // Sorts events chronologically by DTSTART.
    // iCal date strings (YYYYMMDD...) sort correctly as plain strings.
    // -------------------------------------------------------------------------
    function sortEvents(events) {
      return events.slice().sort(function(a, b) {
        return a.dtstart > b.dtstart ? 1 : -1;
      });
    }

    // -------------------------------------------------------------------------
    // RENDER EVENTS
    // Builds the event list HTML and injects it into #content.
    // Category class (cat-meet / cat-other) drives left-border color via CSS.
    // -------------------------------------------------------------------------
    function renderEvents(events) {
      var contentEl = document.getElementById('content');

      if (events.length === 0) {
        contentEl.innerHTML =
          '<p class="no-events">No events match the current filter.<br>' +
          'Check a box above to show events.</p>';
        return;
      }

      var sorted = sortEvents(events);
      var html   = '<ul class="event-list">';

      sorted.forEach(function(event) {
        var dateStr  = formatDate(event.dtstart);
        var timeStr  = formatTime(event.dtstart);
        var catClass = 'event-card cat-' + event.category;

        html += '<li class="' + catClass + '">';
        html += '  <span class="event-date">' + escapeHtml(dateStr) + '</span>';
        html += '  <div class="event-title">' + escapeHtml(event.summary) + '</div>';

        if (event.location) {
          html += '  <div class="event-location">' +
                  escapeHtml(event.location) + '</div>';
        }

        if (timeStr) {
          html += '  <div class="event-time">' + escapeHtml(timeStr) + '</div>';
        }

        if (event.description) {
          html += '  <div class="event-description">' +
                  escapeHtml(event.description) + '</div>';
        }

        html += '</li>';
      });

      html += '</ul>';
      contentEl.innerHTML = html;
    }

    // -------------------------------------------------------------------------
    // ESCAPE HTML
    // Prevents XSS from any unexpected content in the iCal feed.
    // "That's no moon... that's a script injection." - Obi-Wan
    // -------------------------------------------------------------------------
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

  </script>
</body>
</html>
