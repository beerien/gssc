<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!--
    DIVE EVENT FILTER
    Hosted on GitHub Pages, embedded as an iframe in SwimTopia.
    Targets the Upcoming Events snippet (ul.content-list li elements).
    Hides any list item whose anchor text does NOT start with "dive".

    "Searching for dive events like R2-D2 searching for Obi-Wan." - C-3PO
  -->
  <style>
    /* Zero footprint — this page should be invisible in the iframe */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      height: 0;
    }
  </style>
</head>
<body>
<script>

  function runFilter() {
    try {

      // Target the parent SwimTopia page document
      var parentDoc = window.parent.document;

      // ----------------------------------------------------------------------
      // CONFIGURATION
      // Confirmed selectors from DevTools inspection of events-only page:
      //   ul.content-list li  — each event row in the Upcoming Events snippet
      //   li > a              — the anchor tag containing the event title text
      //
      // Update filterPrefix to change what events are shown.
      // ----------------------------------------------------------------------
      var listItemSelector = 'ul.content-list li';
      var filterPrefix     = 'dive';

      // ----------------------------------------------------------------------
      // FILTER LOGIC
      // Grab every list item, find its anchor text, hide if it doesn't
      // start with our prefix. Case-insensitive match.
      // ----------------------------------------------------------------------
      var items = parentDoc.querySelectorAll(listItemSelector);

      if (items.length === 0) {
        console.warn(
          'Dive filter: no items matched "' + listItemSelector + '" in parent. ' +
          'Verify SwimTopia class names in DevTools — they may have changed.'
        );
        return;
      }

      var showCount = 0;
      var hideCount = 0;

      items.forEach(function (item) {

        // Find the anchor tag inside this list item — that holds the event title
        var anchor = item.querySelector('a');

        // If no anchor found, hide the item to be safe
        if (!anchor) {
          item.style.display = 'none';
          hideCount++;
          return;
        }

        // Get the anchor text, trim whitespace, lowercase for comparison
        var titleText = anchor.innerText.trim().toLowerCase();

        // Hide items that do NOT start with "dive"
        if (titleText.indexOf(filterPrefix) !== 0) {
          item.style.display = 'none';
          hideCount++;
        } else {
          showCount++;
        }

      });

      console.log(
        'Dive filter applied — showing: ' + showCount +
        ', hidden: ' + hideCount
      );

    } catch (e) {
      // Same-origin policy block will land here
      console.error('Dive filter blocked by browser security policy: ', e);
    }
  }

  // Run immediately if parent already loaded, otherwise wait
  if (window.parent.document.readyState === 'complete') {
    runFilter();
  } else {
    window.parent.addEventListener('load', runFilter);
  }

</script>
</body>
</html>
